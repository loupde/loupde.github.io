name: DSX Air auto renew

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # UTC 时间，每 6 小时跑一次
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: dsx-air-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run renew script
        id: renew
        env:
          NVIDIA_AIR_API_KEY: ${{ secrets.NVIDIA_AIR_API_KEY }}
          SIMULATION_ID: ${{ secrets.SIMULATION_ID }}
        run: |
          sed -i 's/\r$//' ./dsx_renew.sh
          chmod +x ./dsx_renew.sh
          set +e
          ./dsx_renew.sh | tee /tmp/renew.log
          exit_code=${PIPESTATUS[0]}
          set -e

          sleep_at=$(grep '^after_sleep_at=' /tmp/renew.log | tail -1 | cut -d'=' -f2)
          remaining=""
          if [ -n "$sleep_at" ]; then
            remaining=$(python3 -c 'from datetime import datetime, timezone; import sys; sleep_at = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); seconds = max(0, int((sleep_at - datetime.now(timezone.utc)).total_seconds())); days, rem = divmod(seconds, 86400); hours, rem = divmod(rem, 3600); minutes = rem // 60; print(f"约 {days} 天 {hours} 小时 {minutes} 分钟")' "$sleep_at")
          fi
          echo "sleep_at=$sleep_at" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

          {
            echo "## DSX Air 续期结果"
            if [ "$exit_code" -eq 0 ]; then
              echo "- **状态**：成功"
              echo "- **新 sleep_at**：\`$sleep_at\`"
              echo "- **当前剩余时间**：$remaining"
            else
              echo "- **状态**：失败（exit code $exit_code）"
              echo ""
              echo "**日志最后 20 行**："
              echo '```'
              tail -20 /tmp/renew.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $exit_code

      - name: Notify Discord on success
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLEEP_AT: ${{ steps.renew.outputs.sleep_at }}
          REMAINING: ${{ steps.renew.outputs.remaining }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is empty, skip Discord success notification."
            exit 0
          fi

          jq -n \
            --arg sleep "$SLEEP_AT" \
            --arg remaining "$REMAINING" \
            --arg url "$RUN_URL" '{
              username: "DSX Air Keeper",
              embeds: [{
                title: "DSX Air 续期成功",
                description: ("新 sleep_at: `" + $sleep + "`\n当前剩余时间: **" + $remaining + "**\n[查看运行详情](" + $url + ")"),
                color: 3066993,
                footer: { text: "下次将在 6 小时后自动续期" }
              }]
            }' \
            | curl -sS -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is empty, skip Discord failure notification."
            exit 0
          fi

          jq -n \
            --arg url "$RUN_URL" '{
              username: "DSX Air Keeper",
              embeds: [{
                title: "DSX Air 续期失败",
                description: ("请尽快检查日志：[查看运行详情](" + $url + ")\n\n常见原因：\n- NGC API Key 过期或权限不足\n- Simulation 已被删除或休眠\n- NVIDIA API 临时不可用（5xx）"),
                color: 15158332,
                footer: { text: "下次仍会按计划尝试" }
              }]
            }' \
            | curl -sS -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-
